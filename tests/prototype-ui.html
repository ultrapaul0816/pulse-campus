<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Campus UI acceptance tests</title>
  <style>
    body { margin: 0; padding: 20px; background: #111; color: #eee; font: 14px/1.5 ui-monospace, monospace; }
    iframe { position: fixed; left: -2000px; top: 0; width: 1366px; height: 768px; border: 0; }
    .pass { color: #62d6a7; }
    .fail { color: #ff8585; }
  </style>
</head>
<body>
  <h1>Pulse Campus UI acceptance tests</h1>
  <ol id="results"></ol>
  <iframe id="prototype" title="Prototype under test"></iframe>
  <script>
    const STORAGE = "pulse-campus:dc:v2";
    const frame = document.querySelector("#prototype");
    const results = document.querySelector("#results");
    const failures = [];
    const windowErrors = [];

    function captureWindowError(value) {
      if (windowErrors.length < 100) windowErrors.push(String(value || "unknown window error"));
    }

    window.addEventListener("error", event => captureWindowError(event.error && event.error.stack || event.message));
    window.addEventListener("unhandledrejection", event => captureWindowError(event.reason && event.reason.stack || event.reason));

    async function waitFor(condition, description, timeoutMs = 8000) {
      const started = Date.now();
      while (Date.now() - started <= timeoutMs) {
        const value = condition();
        if (value) return value;
        await new Promise(resolve => setTimeout(resolve, 25));
      }
      throw new Error(`Timed out waiting for ${description}`);
    }

    function report(name, passed, detail = "") {
      const item = document.createElement("li");
      item.className = passed ? "pass" : "fail";
      item.textContent = `${passed ? "PASS" : "FAIL"} — ${name}${detail ? `: ${detail}` : ""}`;
      results.append(item);
      if (!passed) failures.push(name);
    }

    function rgb(value) {
      const parts = value.match(/[\d.]+/g).slice(0, 3).map(Number);
      return parts.map(channel => {
        const normalized = channel / 255;
        return normalized <= 0.03928
          ? normalized / 12.92
          : Math.pow((normalized + 0.055) / 1.055, 2.4);
      });
    }

    function contrast(foreground, background) {
      const luminance = value => {
        const [r, g, b] = rgb(value);
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const values = [luminance(foreground), luminance(background)].sort((a, b) => b - a);
      return (values[0] + 0.05) / (values[1] + 0.05);
    }

    function hasReducedMotionRule(doc) {
      const visit = rules => Array.from(rules || []).some(rule => {
        if (rule.conditionText && rule.conditionText.includes("prefers-reduced-motion")) return true;
        return rule.cssRules ? visit(rule.cssRules) : false;
      });
      return Array.from(doc.styleSheets).some(sheet => {
        try { return visit(sheet.cssRules); } catch (_) { return false; }
      });
    }

    function reducedMotionCss(doc) {
      const chunks = [];
      const visit = rules => Array.from(rules || []).forEach(rule => {
        if (rule.conditionText && rule.conditionText.includes("prefers-reduced-motion")) chunks.push(rule.cssText);
        if (rule.cssRules) visit(rule.cssRules);
      });
      Array.from(doc.styleSheets).forEach(sheet => {
        try { visit(sheet.cssRules); } catch (_) {}
      });
      return chunks.join("\n");
    }

    function visibleInteractiveTargets(doc, selector) {
      return Array.from(doc.querySelectorAll(selector)).filter(element => {
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0 && !element.closest("[aria-hidden='true']");
      });
    }

    function targetGeometryDetail(elements) {
      return elements
        .filter(element => {
          const rect = element.getBoundingClientRect();
          return rect.width < 40 || rect.height < 40;
        })
        .slice(0, 8)
        .map(element => {
          const rect = element.getBoundingClientRect();
          return `${element.tagName.toLowerCase()} ${element.textContent.trim().replace(/\s+/g, " ").slice(0, 24) || element.getAttribute("aria-label") || element.getAttribute("placeholder") || "control"} ${Math.round(rect.width)}×${Math.round(rect.height)}`;
        })
        .join(" | ");
    }

    function allTargetsAtLeast40(elements) {
      return elements.length > 0 && elements.every(element => {
        const rect = element.getBoundingClientRect();
        return rect.width >= 40 && rect.height >= 40;
      });
    }

    async function load(state, name, readySelector, options = {}) {
      frame.src = "about:blank";
      await waitFor(() => frame.contentDocument && frame.contentDocument.URL === "about:blank", `${name} fixture isolation`);
      localStorage.setItem(STORAGE, JSON.stringify(state));
      frame.src = `../index.html?ui-test=${name}-${Date.now()}${options.reduceMotion ? "&ui-test-reduce-motion=1" : ""}`;
      const readyElement = await waitFor(
        () => {
          const element = frame.contentDocument && frame.contentDocument.querySelector(readySelector);
          if (!element) return false;
          const rect = element.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0 ? element : false;
        },
        `${name} screen to render`
      );
      const fixtureWindow = frame.contentWindow;
      fixtureWindow.addEventListener("error", event => captureWindowError(`${name}: ${event.error && event.error.stack || event.message}`));
      fixtureWindow.addEventListener("unhandledrejection", event => captureWindowError(`${name}: ${event.reason && event.reason.stack || event.reason}`));
      return frame.contentDocument;
    }

    async function run() {
      const landing = await load(
        { scene: "landing", collegeId: null, claimed: false },
        "landing",
        "input[placeholder*='NIT Trichy']"
      );
      const landingWindow = frame.contentWindow;
      const input = landing.querySelector("input[placeholder*='NIT Trichy']");
      const inputStyle = getComputedStyle(input);
      const inputRect = input.getBoundingClientRect();
      const inputContrast = contrast(inputStyle.borderTopColor, inputStyle.backgroundColor);

      report("document has a descriptive product title", landing.title.startsWith("Pulse Campus"), landing.title || "empty title");
      const landingPromise = landing.querySelector("[data-screen-label='Landing gate']");
      const landingPromiseText = landingPromise ? landingPromise.textContent.replace(/\s+/g, " ").trim() : "";
      report(
        "landing states the evidence-to-action promise before campus search",
        Boolean(
          landingPromise &&
          /Find the path from your campus to a company\./.test(landingPromiseText) &&
          /See where alumni work/.test(landingPromiseText) &&
          /understand why roles fit/.test(landingPromiseText) &&
          /coordinate outreach/.test(landingPromiseText) &&
          /Explore free · Pro coordinates action/.test(landingPromiseText)
        ),
        landingPromiseText || "landing promise missing"
      );
      report("landing action stays comfortably above the fold at 1366×768", inputRect.bottom <= landingWindow.innerHeight - 48, `input bottom ${Math.round(inputRect.bottom)}px`);
      report("input boundary meets 3:1 component contrast", inputContrast >= 3, `${inputContrast.toFixed(2)}:1`);
      report("current prototype defines reduced-motion behavior", hasReducedMotionRule(landing));

      const landingTargets = visibleInteractiveTargets(landing, "[data-screen-label='Landing gate'] button, [data-screen-label='Landing gate'] input");
      report("landing interactive controls provide at least 40×40px targets", allTargetsAtLeast40(landingTargets), targetGeometryDetail(landingTargets) || `${landingTargets.length} targets`);

      const sourceText = await fetch(`../index.html?source-guard=${Date.now()}`).then(response => response.text());
      const unsafeLocalClaim = /\bDelivered\b|Updates itself\s*[—-]\s*no Excel|Pulse is sending this|Pulse will carry this|2027 invites queued from the placement office|Pulse will remind them once|2 profiles queued|Pulse will carry them/i;
      report(
        "prototype source contains no Delivered, self-updating, or unsimulated local-operation claims",
        !unsafeLocalClaim.test(sourceText),
        (sourceText.match(unsafeLocalClaim) || ["source guard clear"])[0]
      );
      const evidenceDiff = await fetch(`../.superpowers/sdd/2026-08-26-end-to-end-evidence-flow/final-working-review.diff?evidence=${Date.now()}`).then(response => response.text());
      report(
        "the working-review evidence package includes campus-domain controller changes",
        /diff --git a\/app\/data\.js b\/app\/data\.js/.test(evidenceDiff) && /emailDomain:\s*"vit\.ac\.in"/.test(evidenceDiff),
        /diff --git a\/app\/data\.js b\/app\/data\.js/.test(evidenceDiff) ? "app/data.js diff present without VIT domain" : "app/data.js diff missing"
      );

      const campusEmailDomains = {
        nitt: "nitt.edu",
        vit: "vit.ac.in",
        bits: "bits-pilani.ac.in",
        nitk: "nitk.edu.in",
        coep: "coeptech.ac.in",
        dtu: "dtu.ac.in",
        pesu: "pes.edu",
        rvce: "rvce.edu.in",
        psg: "psgtech.edu",
        srm: "srmist.edu.in",
        amrita: "amrita.edu",
        manipal: "manipal.edu",
        jadavpur: "jadavpuruniversity.in",
        anna: "annauniv.edu"
      };
      const dataCampuses = Array.from(landing.defaultView.PULSE_CAMPUS.colleges || []);
      report(
        "every campus declares one canonical work-email domain",
        dataCampuses.length === Object.keys(campusEmailDomains).length && dataCampuses.every(campus => campus.emailDomain === campusEmailDomains[campus.id]),
        dataCampuses.map(campus => `${campus.id}:${campus.emailDomain || "missing"}`).join(", ")
      );

      const vitLanding = await load(
        { scene: "landing", collegeId: null, claimed: false },
        "vit-email-domain",
        "input[placeholder*='NIT Trichy']",
        { reduceMotion: true }
      );
      const vitSearch = vitLanding.querySelector("input[placeholder*='NIT Trichy']");
      vitSearch.value = "VIT Vellore";
      vitSearch.dispatchEvent(new Event("input", { bubbles: true }));
      const vitChoice = await waitFor(
        () => Array.from(vitLanding.querySelectorAll("button")).find(button => button.textContent.includes("VIT Vellore")),
        "VIT Vellore campus choice"
      );
      vitChoice.click();
      const vitClaim = await waitFor(() => vitLanding.querySelector("[data-flow-stage='claim']"), "VIT claim form");
      const vitName = vitClaim.querySelector("input[type='text']");
      const vitRole = vitClaim.querySelector("[data-flow-role]");
      const vitEmail = vitClaim.querySelector("input[type='email']");
      vitName.value = "VIT Domain Test";
      vitName.dispatchEvent(new Event("input", { bubbles: true }));
      vitRole.value = "Placement Head";
      vitRole.dispatchEvent(new Event("input", { bubbles: true }));
      vitEmail.value = "wrong@example.com";
      vitEmail.dispatchEvent(new Event("input", { bubbles: true }));
      await new Promise(resolve => setTimeout(resolve, 40));
      Array.from(vitLanding.querySelector("[data-flow-stage='claim']").querySelectorAll("button")).find(button => button.textContent.includes("Verify work email")).click();
      await new Promise(resolve => setTimeout(resolve, 40));
      const invalidVitEmail = vitLanding.querySelector("[data-flow-stage='claim'] input[type='email']");
      const invalidVitAlert = vitLanding.querySelector("[data-flow-stage='claim'] [role='alert']");
      report(
        "invalid campus email explains the canonical domain and keeps the entered value",
        Boolean(invalidVitEmail && invalidVitEmail.value === "wrong@example.com" && invalidVitAlert && invalidVitAlert.textContent.includes("vit.ac.in")),
        invalidVitAlert ? `${invalidVitEmail.value} · ${invalidVitAlert.textContent.trim()}` : "invalid-domain feedback missing"
      );
      const visibleVitPlaceholder = invalidVitEmail ? invalidVitEmail.getAttribute("placeholder") : "";
      invalidVitEmail.value = visibleVitPlaceholder;
      invalidVitEmail.dispatchEvent(new Event("input", { bubbles: true }));
      await new Promise(resolve => setTimeout(resolve, 40));
      Array.from(vitLanding.querySelector("[data-flow-stage='claim']").querySelectorAll("button")).find(button => button.textContent.includes("Verify work email")).click();
      const vitValidation = await waitFor(() => vitLanding.querySelector("[data-flow-stage='validating']"), "VIT placeholder email validation", 700).catch(() => null);
      report(
        "the visible canonical campus-email placeholder submits successfully",
        Boolean(visibleVitPlaceholder === "tpo@vit.ac.in" && vitValidation),
        `${visibleVitPlaceholder || "placeholder missing"} · ${vitValidation ? "validating" : "rejected"}`
      );

      const malformedVit = await load(
        {
          scene: "campus",
          collegeId: "vit",
          claimed: false,
          claimStep: "form",
          profile: { name: "Malformed Domain Test", email: "x@@vit.ac.in", role: "Placement Head" }
        },
        "malformed-vit-email",
        "[data-flow-stage='claim']",
        { reduceMotion: true }
      );
      const malformedSubmit = Array.from(malformedVit.querySelectorAll("[data-flow-stage='claim'] button")).find(button => button.textContent.includes("Verify work email"));
      if (malformedSubmit) malformedSubmit.click();
      await new Promise(resolve => setTimeout(resolve, 40));
      const malformedClaim = malformedVit.querySelector("[data-flow-stage='claim']");
      const malformedInput = malformedClaim && malformedClaim.querySelector("input[type='email']");
      const malformedAlert = malformedClaim && malformedClaim.querySelector("[role='alert']");
      report(
        "campus validation rejects malformed addresses that merely end in the canonical domain",
        Boolean(malformedInput && malformedInput.value === "x@@vit.ac.in" && malformedAlert && /vit\.ac\.in/.test(malformedAlert.textContent)),
        malformedClaim ? `${malformedInput ? malformedInput.value : "input missing"} · ${malformedAlert ? malformedAlert.textContent.trim() : "alert missing"}` : "malformed email was accepted"
      );

      const onboardingLanding = await load(
        { scene: "landing", collegeId: null, claimed: false },
        "onboarding-landing",
        "input[placeholder*='NIT Trichy']"
      );
      const onboardingSearch = onboardingLanding.querySelector("input[placeholder*='NIT Trichy']");
      onboardingSearch.value = "NIT Trichy";
      onboardingSearch.dispatchEvent(new Event("input", { bubbles: true }));
      const nittChoice = await waitFor(
        () => Array.from(onboardingLanding.querySelectorAll("button")).find(button => button.textContent.includes("NIT Trichy")),
        "NIT Trichy campus choice"
      );
      nittChoice.click();
      const claimForm = await waitFor(
        () => onboardingLanding.querySelector("[data-flow-stage='claim']"),
        "claim form after campus selection",
        1500
      ).catch(() => null);
      const claimRole = claimForm && claimForm.querySelector("[data-flow-role]");
      const claimEmail = claimForm && claimForm.querySelector("input[type='email']");
      report(
        "campus selection opens a claim form with placement role and work email",
        Boolean(claimForm && claimRole && claimEmail && /simulates work-domain verification/i.test(claimForm.textContent)),
        claimForm ? claimForm.textContent.replace(/\s+/g, " ").trim() : "claim form missing"
      );

      if (claimForm && claimRole && claimEmail) {
        const name = claimForm.querySelector("input[type='text']");
        name.value = "UI Test";
        name.dispatchEvent(new Event("input", { bubbles: true }));
        await new Promise(resolve => setTimeout(resolve, 40));
        const email = onboardingLanding.querySelector("[data-flow-stage='claim'] input[type='email']");
        email.value = "test@nitt.edu";
        email.dispatchEvent(new Event("input", { bubbles: true }));
        await new Promise(resolve => setTimeout(resolve, 40));
        Array.from(onboardingLanding.querySelector("[data-flow-stage='claim']").querySelectorAll("button")).find(button => button.textContent.includes("Verify work email")).click();
      }
      const persistedOnboarding = JSON.parse(localStorage.getItem(STORAGE) || "{}");
      report(
        "transient onboarding fields are omitted from persisted v2 state",
        !["onboardingStage", "validationStep", "claimError"].some(key => Object.prototype.hasOwnProperty.call(persistedOnboarding, key)),
        Object.keys(persistedOnboarding).filter(key => ["onboardingStage", "validationStep", "claimError"].includes(key)).join(", ") || "none"
      );
      const validationPanel = await waitFor(
        () => onboardingLanding.querySelector("[data-flow-stage='validating']"),
        "simulated work-email validation",
        2500
      ).catch(() => null);
      const validationText = validationPanel ? validationPanel.textContent.replace(/\s+/g, " ") : "";
      report(
        "simulated work-email validation shows every office verification step",
        Boolean(validationPanel && validationPanel.querySelector("[data-validation-step='2']") && /Check work domain/.test(validationText) && /Match campus office/.test(validationText) && /Secure campus graph/.test(validationText) && /simulated/i.test(validationText)),
        validationText || "validation panel missing"
      );
      const firstValidationStep = validationPanel && validationPanel.querySelector("[data-validation-step='1']");
      const firstStepStartsChecking = firstValidationStep && /checking/i.test(firstValidationStep.textContent);
      const secondValidationStep = await waitFor(
        () => {
          const step = onboardingLanding.querySelector("[data-validation-step='2']");
          return step && /checking/i.test(step.textContent) ? step : false;
        },
        "second validation step to begin",
        1000
      ).catch(() => null);
      report(
        "normal-motion validation progresses one visible check at a time",
        Boolean(firstStepStartsChecking && secondValidationStep),
        `${firstStepStartsChecking ? "step 1 checking" : "step 1 did not begin checking"}; ${secondValidationStep ? "step 2 checking" : "step 2 never checked"}`
      );

      const welcomePanel = await waitFor(
        () => onboardingLanding.querySelector("[data-flow-welcome]"),
        "welcome calibration panel",
        3000
      ).catch(() => null);
      const welcomeText = welcomePanel ? welcomePanel.textContent.replace(/\s+/g, " ") : "";
      report(
        "welcome calibrates Free exploration and Pro reviewed action before radar entry",
        Boolean(welcomePanel && /Free: explore all evidence \+ 3 introductions\/day/.test(welcomeText) && /Pro: AI plans and reviewed batch outreach/.test(welcomeText) && /Enter campus radar/.test(welcomeText) && /employers mapped/.test(welcomeText) && /alumni available on Pulse/.test(welcomeText) && /warm live roles/.test(welcomeText)),
        welcomeText || "welcome panel missing"
      );
      const enterRadar = welcomePanel && Array.from(welcomePanel.querySelectorAll("button")).find(button => button.textContent.includes("Enter campus radar"));
      if (enterRadar) enterRadar.click();
      const enteredRadar = await waitFor(
        () => onboardingLanding.querySelector("[data-flow-welcome]") ? false : onboardingLanding.querySelector("[data-screen-label='Market tape']"),
        "campus radar after welcome",
        1500
      ).catch(() => null);
      report("welcome enters the claimed campus radar", Boolean(enteredRadar), enteredRadar ? "radar visible" : "radar not entered");

      const reducedLanding = await load(
        { scene: "landing", collegeId: null, claimed: false },
        "onboarding-reduced-motion",
        "input[placeholder*='NIT Trichy']",
        { reduceMotion: true }
      );
      const reducedSearch = reducedLanding.querySelector("input[placeholder*='NIT Trichy']");
      reducedSearch.value = "NIT Trichy";
      reducedSearch.dispatchEvent(new Event("input", { bubbles: true }));
      const reducedChoice = await waitFor(
        () => Array.from(reducedLanding.querySelectorAll("button")).find(button => button.textContent.includes("NIT Trichy")),
        "reduced-motion NIT Trichy choice"
      );
      reducedChoice.click();
      const reducedClaim = await waitFor(() => reducedLanding.querySelector("[data-flow-stage='claim']"), "reduced-motion claim form");
      const reducedName = reducedClaim.querySelector("input[type='text']");
      reducedName.value = "Reduced Motion Test";
      reducedName.dispatchEvent(new Event("input", { bubbles: true }));
      await new Promise(resolve => setTimeout(resolve, 40));
      const reducedEmail = reducedLanding.querySelector("[data-flow-stage='claim'] input[type='email']");
      reducedEmail.value = "reduced@nitt.edu";
      reducedEmail.dispatchEvent(new Event("input", { bubbles: true }));
      await new Promise(resolve => setTimeout(resolve, 40));
      Array.from(reducedLanding.querySelector("[data-flow-stage='claim']").querySelectorAll("button")).find(button => button.textContent.includes("Verify work email")).click();
      const reducedValidation = await waitFor(
        () => reducedLanding.querySelector("[data-flow-stage='validating']"),
        "completed reduced-motion validation",
        500
      ).catch(() => null);
      await new Promise(resolve => setTimeout(resolve, 180));
      const reducedRows = reducedValidation ? Array.from(reducedValidation.querySelectorAll("[data-validation-step]")) : [];
      const reducedWelcomeVisible = Boolean(reducedLanding.querySelector("[data-flow-welcome]"));
      report(
        "reduced motion visibly completes validation before welcome",
        reducedRows.length === 3 && reducedRows.every(row => /verified/i.test(row.textContent)) && !reducedWelcomeVisible,
        reducedValidation ? `${reducedRows.filter(row => /verified/i.test(row.textContent)).length}/3 verified; welcome ${reducedWelcomeVisible ? "visible" : "deferred"}` : "validation panel missing"
      );

      const campus = await load({
        scene: "campus",
        collegeId: "nitt",
        claimed: true,
        profile: { name: "UI Test", email: "test@nitt.edu", role: "Placement Head" },
        looks: 3,
        inspectCompany: null,
        inspectName: null,
        onPulse: [],
        pings: [
          { label: "Newest campus signal", time: "day 1", id: 2 },
          { label: "Earlier campus signal", time: "day 1", id: 1 }
        ],
        view: "radar"
      }, "campus", "button[aria-label^='Software Engineer at Infosys']");

      const rootStyle = getComputedStyle(campus.documentElement);
      const progress = campus.querySelector("[data-progress-bar]");
      const progressStyle = progress ? getComputedStyle(progress) : null;
      const journeyStep = campus.querySelector(".journey-step");
      const journeyStyle = journeyStep ? getComputedStyle(journeyStep) : null;
      const tapeTrack = campus.querySelector(".market-tape-track");
      const tapeViewport = tapeTrack ? tapeTrack.parentElement : null;
      const tapeTrackStyle = tapeTrack ? getComputedStyle(tapeTrack) : null;
      const tapeViewportStyle = tapeViewport ? getComputedStyle(tapeViewport) : null;
      const pulseButton = Array.from(campus.querySelectorAll("button")).find(button => button.textContent.includes("Pulse") && button.textContent.includes("3"));
      const pulseButtonStyle = pulseButton ? getComputedStyle(pulseButton) : null;
      const feedItems = Array.from(campus.querySelectorAll("[data-ping-feed-item]"));
      const dockButtons = Array.from(campus.querySelectorAll(".dock-button"));
      const radarCompanies = Array.from(campus.querySelectorAll(".radar-target"));
      const companyCountLine = campus.querySelector("[data-company-count]");
      const dockMarks = Array.from(campus.querySelectorAll(".dock-company-logo"));
      const headerAndMarketTargets = visibleInteractiveTargets(campus, ".app-header button, .app-header summary, .market-tape button, .company-dock button, [data-company-directory-trigger]");

      report("motion uses shared strong easing tokens", rootStyle.getPropertyValue("--ease-out").includes("0.23") && rootStyle.getPropertyValue("--ease-in-out").includes("0.77"));
      report("header, filters, tape, and company-dock controls provide at least 40×40px targets", allTargetsAtLeast40(headerAndMarketTargets), targetGeometryDetail(headerAndMarketTargets) || `${headerAndMarketTargets.length} targets`);
      report("outreach progress animates on the compositor", progressStyle && progressStyle.transitionProperty.includes("transform") && !progressStyle.transitionProperty.includes("width"), progressStyle ? progressStyle.transitionProperty : "progress bar missing");
      report("journey state changes use restrained color transitions", journeyStyle && journeyStyle.transitionProperty.includes("color") && parseFloat(journeyStyle.transitionDuration) <= 0.16, journeyStyle ? `${journeyStyle.transitionProperty} ${journeyStyle.transitionDuration}` : "journey step missing");
      report("the detailed company dock is capped at twelve choices", dockButtons.length === 12, `${dockButtons.length} detailed companies`);
      report("the radar still represents every campus employer", radarCompanies.length === 27, `${radarCompanies.length} employer signals`);
      report("the dock summary states the visible and full employer counts", companyCountLine && /Showing 12 of 27 employers/.test(companyCountLine.textContent), companyCountLine ? companyCountLine.textContent.trim() : "summary missing");
      report("dock company marks stay compact", dockMarks.length === 12 && dockMarks.every(mark => mark.getBoundingClientRect().width <= 30 && mark.getBoundingClientRect().height <= 30), `${dockMarks.length} marks`);
      const dockLogoImages = dockMarks.map(mark => mark.querySelector("img[data-logo]")).filter(Boolean);
      const neutralDockEdges = new Set(dockMarks.map(mark => getComputedStyle(mark).boxShadow));
      const availabilityDots = Array.from(campus.querySelectorAll("[data-alumni-available]"));
      report("loaded company logos fully cover the colored fallback", dockLogoImages.length === dockMarks.length && dockLogoImages.every(image => {
        const imageRect = image.getBoundingClientRect();
        const markRect = image.parentElement.getBoundingClientRect();
        return Math.abs(imageRect.width - markRect.width) <= 1 && Math.abs(imageRect.height - markRect.height) <= 1;
      }), `${dockLogoImages.length}/${dockMarks.length} full-tile logos`);
      report("ordinary company logos use one quiet neutral edge", neutralDockEdges.size === 1 && !Array.from(neutralDockEdges)[0].includes("8, 164, 184"), Array.from(neutralDockEdges).join(", "));
      report("alumni availability uses a discrete status dot", availabilityDots.length > 0 && availabilityDots.every(dot => dot.getAttribute("aria-hidden") === "true" && getComputedStyle(dot).backgroundColor === "rgb(58, 214, 201)"), `${availabilityDots.length} availability dots`);

          const validRows = rows.length === 3 && rows.every(row => {
            const actual = Array.from(row.skills || []);
            return JSON.stringify(actual) === JSON.stringify(expected) && (expected.length ? expected.every(skill => row.reason.includes(skill)) : /skills require review/i.test(row.reason));
          });
          if (!validRows) skillFailures.push(`${job.id}:${job.eligibility} -> ${rows.map(row => `[${(row.skills || []).join(",")}] ${row.reason}`).join(" | ")}`);
        });
      }
      report(
        "every distinct job eligibility pattern derives only explicit roster skills, including j14 without SQL",
        skillFailures.length === 0,
        skillFailures.slice(0, 6).join(" || ") || `${Object.keys(eligibilitySkillExpectations).length} job patterns checked`
      );
      const aliasApiReady = prototypeApi && ["canonicalCompanyKey", "sameCompany", "jobsForCompany", "companyLogoDomain"].every(name => typeof prototypeApi[name] === "function");
      const aliasApiJobs = aliasApiReady ? prototypeApi.jobsForCompany("Reliance") : [];
      report(
        "one canonical Reliance registry serves identity, jobs, pings/ranking inputs, logos, and persistence keys",
        Boolean(
          aliasApiReady &&
          prototypeApi.canonicalCompanyKey("Reliance") === "reliance" &&
          prototypeApi.canonicalCompanyKey("Reliance Industries") === "reliance" &&
          prototypeApi.sameCompany("Reliance", "Reliance Industries") &&
          aliasApiJobs.some(job => job.id === "j10" && job.company === "Reliance Industries") &&
          prototypeApi.companyLogoDomain("Reliance") === "ril.com" &&
          prototypeApi.companyLogoDomain("Reliance Industries") === "ril.com"
        ),
        aliasApiReady ? `${prototypeApi.canonicalCompanyKey("Reliance Industries")} · ${aliasApiJobs.map(job => job.id).join(",")} · ${prototypeApi.companyLogoDomain("Reliance Industries")}` : "canonical alias API missing"
      );
      report(
        "Bosch Global Software reuses the Bosch logo without merging company identity",
        Boolean(
          aliasApiReady &&
          prototypeApi.canonicalCompanyKey("Bosch Global Software") === "bosch global software" &&
          !prototypeApi.sameCompany("Bosch Global Software", "Bosch") &&
          prototypeApi.companyLogoDomain("Bosch Global Software") === "bosch.com"
        ),
        aliasApiReady ? `${prototypeApi.canonicalCompanyKey("Bosch Global Software")} · ${prototypeApi.companyLogoDomain("Bosch Global Software")}` : "company identity API missing"
      );
      report(
        "bounded harness and fixture window-error capture remains empty",
        windowErrors.length === 0,
        windowErrors.length ? windowErrors.join(" | ") : "0 window errors (limit 100)"
      );

      document.documentElement.dataset.complete = "true";
      document.documentElement.dataset.failures = String(failures.length);
      const summary = document.createElement("p");
      summary.id = "summary";
      summary.className = failures.length ? "fail" : "pass";
      summary.textContent = failures.length ? `${failures.length} acceptance checks failed.` : "All acceptance checks passed.";
      results.after(summary);
    }

    run().catch(error => {
      report("test harness completed", false, error.stack || error.message);
      document.documentElement.dataset.complete = "true";
      document.documentElement.dataset.failures = "1";
      const summary = document.createElement("p");
      summary.id = "summary";
      summary.className = "fail";
      summary.textContent = "The acceptance harness could not complete.";
      results.after(summary);
    });
  </script>
</body>
